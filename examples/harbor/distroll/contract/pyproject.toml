[project]
name = "agentic-rollout-contract"
version = "0.1.0"
description = "Neutral CPU/GPU protocol for decoupled Agentic RL rollout"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.11,<3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
