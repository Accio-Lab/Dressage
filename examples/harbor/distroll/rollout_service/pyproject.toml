[project]
name = "dressage-distroll-rollout-service"
version = "0.1.0"
description = "Independent CPU Harbor rollout control plane and worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agentic-rollout-contract==0.1.0",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "harbor==0.22.0",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "uvicorn>=0.30,<1",
]

[project.scripts]
rollout-control-plane = "rollout_service.cli:control_main"
rollout-worker = "rollout_service.cli:worker_main"
rollout-migrate = "rollout_service.cli:migrate_main"
rollout-network-gateway = "rollout_service.cli:network_gateway_main"
rollout-build-task-resource-index = "rollout_service.task_resource_index:task_resource_index_main"
rollout-image-cleaner = "rollout_service.image_cleaner:image_cleaner_main"
rollout-node-observer = "rollout_service.observability.node_agent:main"
rollout-dashboard = "rollout_service.observability.dashboard:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rollout_service = ["migrations/*.sql", "*.yaml", "observability/static/*"]
