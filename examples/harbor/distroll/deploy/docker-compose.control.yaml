name: dressage-distroll

services:
  postgres:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: rollout
      POSTGRES_USER: rollout
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:15432:5432"
    mem_limit: 4g
    pids_limit: 1024
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rollout -d rollout"]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
