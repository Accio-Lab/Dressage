[project]
name = "dressage-distroll-gpu-adapter"
version = "0.1.0"
description = "Dressage GPU adapter for the decoupled CPU Harbor rollout service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agentic-rollout-contract==0.1.0",
  "dressage==0.1.0",
  "dressage-blackbox-server==1.1.0",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.11,<3",
  "uvicorn>=0.30,<1",
]

[project.scripts]
dressage-distroll-policy-service = "dressage_distroll_gpu_adapter.cli:policy_main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
