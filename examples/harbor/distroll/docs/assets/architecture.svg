<text x="1068" y="579" font-size="16" fill="#62738A" text-anchor="start">Sandbox protection</text>
<text x="44" y="686" font-size="18" fill="#62738A" text-anchor="start">Only the Heads cross the cluster boundary. Workers and ranks use internal networks.</text>
<text x="44" y="724" font-size="18" fill="#62738A" text-anchor="start">The link is reachable but may stall or disconnect; application protocols handle bounded recovery.</text>
