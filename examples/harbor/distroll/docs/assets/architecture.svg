<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="765" viewBox="0 0 1320 765">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="#FAFCFF"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="44" y="54" font-size="29" fill="#1C2D47" text-anchor="start">Dressage DistRoll</text>
<text x="44" y="90" font-size="17" fill="#62738A" text-anchor="start">A self-managed CPU execution pool, separate from GPU inference and training</text>
