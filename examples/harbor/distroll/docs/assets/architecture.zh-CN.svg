<text x="328" y="579" font-size="16" fill="#62738A" text-anchor="start">接收新权重</text>
<path d="M909,426 L909,468" stroke="#188579" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
<rect x="804" y="477" width="212" height="127" rx="14" fill="white" stroke="#DCE5F0" />
<rect x="822" y="497" width="5" height="23" rx="2" fill="#188579" />
