<text x="660" y="293" font-size="12" fill="#62738A" text-anchor="middle">reserve / query / cancel / ACK</text>
<path d="M804,334 L516,334" stroke="#188579" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
<text x="660" y="317" font-size="17" fill="#188579" text-anchor="middle">模型通道管理</text>
<text x="660" y="360" font-size="12" fill="#62738A" text-anchor="middle">bind / open / seal / revoke</text>
