<text x="828" y="550" font-size="16" fill="#62738A" text-anchor="start">Harbor / Agent</text>
<text x="828" y="579" font-size="16" fill="#62738A" text-anchor="start">验证器与沙箱</text>
<path d="M1149,426 L1149,468" stroke="#188579" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
<rect x="1044" y="477" width="212" height="127" rx="14" fill="white" stroke="#DCE5F0" />
<rect x="1062" y="497" width="5" height="23" rx="2" fill="#188579" />
<text x="1078" y="516" font-size="21" fill="#1C2D47" text-anchor="start">Worker N</text>
<text x="1068" y="550" font-size="16" fill="#62738A" text-anchor="start">镜像缓存</text>
<text x="1068" y="579" font-size="16" fill="#62738A" text-anchor="start">沙箱资源保护</text>
<text x="44" y="686" font-size="18" fill="#62738A" text-anchor="start">仅两个Head跨集群通信；Worker与训练rank分别使用各自内网。</text>
<text x="44" y="724" font-size="18" fill="#62738A" text-anchor="start">链路可达但可能抖动或中断；业务协议提供有界恢复。</text>
</g></svg>